server:
  port: 8085
  address: 0.0.0.0

spring:
  application:
    name: xpense-tracker
  datasource:
    tracker:
      hikari:
#        jdbc-url: jdbc:postgresql://localhost:5432/xpense_tracker
#        username: xpense_admin
#        password: xpenseTracker1234
#        driver-class-name: org.postgresql.Driver
#        maximum-pool-size: 30
#        minimum-idle: 10
#        connection-timeout: 30000
#        idle-timeout: 60000
#        max-lifetime: 1800000
            jdbc-url: jdbc:postgresql://localhost:5432/test_db
            username: restore_user
            password: restoreUser1234
            driver-class-name: org.postgresql.Driver
            maximum-pool-size: 30
            minimum-idle: 10
            connection-timeout: 30000
            idle-timeout: 60000
            max-lifetime: 1800000
    mf:
      hikari:
        jdbc-url: jdbc:postgresql://localhost:5432/mf
        username: xpense_admin
        password: xpenseTracker1234
        driver-class-name: org.postgresql.Driver
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 60000
        max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 
            client-secret: 
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/drive.file #drive access
            redirect-uri: "http://localhost:8085/login/oauth2/code/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

