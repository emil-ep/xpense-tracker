spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${GOOGLE_REDIRECT_URI}"
  datasource:
    tracker:
      hikari:
        jdbc-url: ${TRACKER_DATASOURCE_URL}
        username: ${TRACKER_DATASOURCE_USERNAME}
        password: ${TRACKER_DATASOURCE_PASSWORD}
    mf:
      hikari:
        jdbc-url: ${MF_DATASOURCE_URL}
        username: ${MF_DATASOURCE_USERNAME}
        password: ${MF_DATASOURCE_PASSWORD}

file:
  upload:
    path: /app/uploads
    attachment:
      path: /app/uploads/attachments

token:
  signing:
    key: ${TOKEN_SIGNING_KEY}

frontend:
  url: ${FRONTEND_URL}

xpense:
  internal:
    username: ${INTERNAL_SERVICE_USERNAME}
    password: ${INTERNAL_SERVICE_PASSWORD}

logging:
  structured:
    format:
      console: ecs
